<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add a Book | BookShelf</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6fb;
            color: #1e293b;
            min-height: 100vh;
        }

        .navbar {
            background: #ffffff;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
            color: #4f46e5;
        }

        .nav-label {
            color: #64748b;
            font-size: 14px;
        }

        .hero {
            background: linear-gradient(135deg, #4338ca, #7c3aed);
            color: white;
            padding: 55px 8%;
        }

        .hero h1 {
            font-size: clamp(30px, 5vw, 44px);
            margin-bottom: 12px;
        }

        .hero p {
            color: #e0e7ff;
            font-size: 16px;
            line-height: 1.7;
            max-width: 600px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 24px 60px;
        }

        .form-card {
            background: #ffffff;
            border: 1px solid #e8eaf0;
            border-radius: 16px;
            padding: 36px 32px;
        }

        .form-card h2 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .form-card .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .form-card p {
            margin-bottom: 18px;
        }

        .form-card label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-card input[type="text"],
        .form-card input[type="email"],
        .form-card input[type="number"],
        .form-card textarea,
        .form-card select {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            font-family: inherit;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            background: #f9fafb;
            color: #1e293b;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-card input:focus,
        .form-card textarea:focus,
        .form-card select:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.2);
            background: #ffffff;
        }

        .btn-submit {
            display: inline-block;
            background: linear-gradient(135deg, #4338ca, #7c3aed);
            color: white;
            border: none;
            padding: 14px 36px;
            font-size: 15px;
            font-weight: 700;
            font-family: inherit;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(67, 56, 202, 0.25);
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4f46e5;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            padding: 25px 15px;
            color: #64748b;
            font-size: 13px;
            border-top: 1px solid #e5e7eb;
            background: white;
        }

        @media (max-width: 600px) {
            .navbar { padding: 18px 6%; }
            .hero { padding: 40px 6%; }
            .container { padding: 28px 18px 45px; }
            .form-card { padding: 28px 20px; }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">📚 BookShelf</div>
        <div class="nav-label">Your Digital Library</div>
    </nav>

    <header class="hero">
        <h1>Add a New Book</h1>
        <p>
            Fill in the details below to add a new book to your collection.
        </p>
    </header>

    <main class="container">

        <div class="form-card">
            <h2>Book Details</h2>
            <p class="subtitle">Enter the title and author of the book you'd like to add.</p>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn-submit">📖 Add Book</button>
            </form>

            <a href="{% url 'book_list' %}" class="back-link">← Back to Book List</a>
        </div>

    </main>

    <footer>
        Built with Django · BookShelf Library System
    </footer>

</body>
</html>
